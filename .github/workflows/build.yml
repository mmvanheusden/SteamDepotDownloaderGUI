name: build_tauri

on:
  workflow_call:
    inputs:
      debug:
        description: Build with debug settings
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: macos-arm64
            package: macOS
            architecture: aarch64
            bundle_glob: '*.dmg'
          - name: macOS Intel
            runner: macos-26
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: macos-x64
            package: macOS
            architecture: x64
            bundle_glob: '*.dmg'
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage
            artifact: linux-x64
            package: Linux
            architecture: x64
            bundle_glob: '*.AppImage'
          - name: Linux ARM64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles appimage
            artifact: linux-arm64
            package: Linux
            architecture: aarch64
            bundle_glob: '*.AppImage'
          - name: Windows x64
            runner: windows-2025
            target: ''
            args: ''
            artifact: windows-x64
            package: Windows
            architecture: x64
            bundle_glob: '*.exe'
          - name: Windows ARM64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            artifact: windows-arm64
            package: Windows
            architecture: aarch64
            bundle_glob: '*.exe'

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ inputs.debug && '--debug ' || '' }}${{ matrix.args }}
          uploadUpdaterJson: false

      - name: Rename bundle
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          ARCHITECTURE: ${{ matrix.architecture }}
          BUNDLE_GLOB: ${{ matrix.bundle_glob }}
          TARGET: ${{ matrix.target }}
          DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail

          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          profile=release
          if [[ "$DEBUG" == "true" ]]; then
            profile=debug
          fi

          bundle_dir="src-tauri/target"
          if [[ -n "$TARGET" ]]; then
            bundle_dir="$bundle_dir/$TARGET"
          fi
          bundle_dir="$bundle_dir/$profile/bundle"
          source_file="$(find "$bundle_dir" -type f -iname "$BUNDLE_GLOB" -print -quit)"

          if [[ -z "$source_file" ]]; then
            echo "No bundle matching $BUNDLE_GLOB found in $bundle_dir" >&2
            exit 1
          fi

          mkdir -p renamed-bundle
          extension="${BUNDLE_GLOB#*.}"
          destination="renamed-bundle/SteamDepotDownloaderGUI-$PACKAGE-v$version-$ARCHITECTURE.$extension"
          cp "$source_file" "$destination"

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}${{ inputs.debug && '-debug' || '' }}
          path: renamed-bundle
          if-no-files-found: error
